name: auth_uae_pass
description: Production-ready UAE PASS SDK for Flutter. Supports seamless login, Biometric FaceID (SOP3), and secure profile retrieval for UAE citizens and visitors.
version: 0.0.7
homepage: https://github.com/ShithinCherathuparambil/auth_uae_pass
repository: https://github.com/ShithinCherathuparambil/auth_uae_pass

topics:
  - uae-pass
  - emirates-id
  - digital-id
  - identity
  - authentication

environment:
  sdk: ^3.11.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  flutter_inappwebview: ^6.1.5
  http: ^1.5.0
  url_launcher: ^6.3.2
  appcheck: ^1.7.0
  app_links: ^7.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/uae_pass_icon.png
    - assets/uae_pass_icon_light.png

